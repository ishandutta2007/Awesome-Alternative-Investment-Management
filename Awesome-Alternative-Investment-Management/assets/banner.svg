<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dynamic Pulse Keyframes -->
    <style>
      .network-line {
        stroke: #6366f1;
        stroke-opacity: 0.25;
        stroke-dasharray: 8, 8;
        animation: dash 30s linear infinite;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .pulse-node-2 {
        animation: pulse 4s ease-in-out infinite alternate 1s;
      }
      .floating-particle {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0% { r: 6; fill-opacity: 0.5; }
        100% { r: 12; fill-opacity: 0.9; }
      }
      @keyframes float {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-15px) scale(1.05); }
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #cbd5e1;
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Animated Network Mesh / Knowledge Graph Elements -->
  <g opacity="0.6">
    <line x1="80" y1="80" x2="260" y2="180" class="network-line" stroke-width="1.5" />
    <line x1="260" y1="180" x2="120" y2="340" class="network-line" stroke-width="1.5" />
    <line x1="260" y1="180" x2="480" y2="120" class="network-line" stroke-width="1.5" />
    <line x1="920" y1="90" x2="1060" y2="210" class="network-line" stroke-width="1.5" />
    <line x1="1060" y1="210" x2="900" y2="340" class="network-line" stroke-width="1.5" />
    <line x1="1060" y1="210" x2="1140" y2="320" class="network-line" stroke-width="1.5" />

    <circle cx="80" cy="80" r="5" fill="#6366f1" class="floating-particle" />
    <circle cx="260" cy="180" r="8" fill="#a855f7" class="pulse-node" />
    <circle cx="120" cy="340" r="6" fill="#ec4899" class="floating-particle" />
    <circle cx="480" cy="120" r="7" fill="#38bdf8" class="pulse-node-2" />
    <circle cx="920" cy="90" r="6" fill="#a855f7" class="floating-particle" />
    <circle cx="1060" cy="210" r="9" fill="#ec4899" class="pulse-node" />
    <circle cx="900" cy="340" r="7" fill="#6366f1" class="pulse-node-2" />
    <circle cx="1140" cy="320" r="5" fill="#38bdf8" class="floating-particle" />
  </g>

  <!-- Decorative Glowing Gradient Bar -->
  <rect x="80" y="115" width="140" height="4" rx="2" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Foreground Content Block -->
  <g transform="translate(80, 0)">
    <!-- Sub-header Tag -->
    <text x="0" y="100" class="badge-text">⚡ CURATED INVESTMENT ECOSYSTEM ⚡</text>

    <!-- Main Title -->
    <text x="0" y="175" class="title-text">Awesome Alternative Investment Management</text>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle-text">Private Equity • Venture Capital • Private Credit • Fund Admin • Real Estate</text>

    <!-- Pill Tags -->
    <g transform="translate(0, 265)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="85" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">💼 Private Capital</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="270" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#a855f7" text-anchor="middle">📊 Fund Accounting</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="460" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#ec4899" text-anchor="middle">🤝 Deal Flow CRM</text>

      <!-- Pill 4 -->
      <rect x="565" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="650" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#10b981" text-anchor="middle">⚡ Open-Source Stack</text>
    </g>
  </g>
</svg>
