<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulse{0%{r:6;fill-opacity:.5}}@keyframes float{0%{transform:translateY(0) scale(1)}}.network-line{stroke:#6366f1;stroke-opacity:.25;stroke-dasharray:8,8;animation:dash 30s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite alternate}.pulse-node-2{animation:pulse 4s ease-in-out infinite alternate 1s}.floating-particle{animation:float 6s ease-in-out infinite alternate}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;fill:#cbd5e1;letter-spacing:.5px}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".6"><line x1="80" x2="260" y1="80" y2="180" stroke-width="1.5" class="network-line"/><line x1="260" x2="120" y1="180" y2="340" stroke-width="1.5" class="network-line"/><line x1="260" x2="480" y1="180" y2="120" stroke-width="1.5" class="network-line"/><line x1="920" x2="1060" y1="90" y2="210" stroke-width="1.5" class="network-line"/><line x1="1060" x2="900" y1="210" y2="340" stroke-width="1.5" class="network-line"/><li