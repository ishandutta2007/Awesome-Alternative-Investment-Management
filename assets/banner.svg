<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#text-grad);
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
      }
      .chart-line {
        fill: none;
        stroke: url(#accent-grad);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 4s ease-in-out infinite alternate;
      }
      .chart-area {
        fill: url(#accent-grad);
        opacity: 0.12;
      }
      .pulse-circle {
        animation: pulse 2.5s ease-in-out infinite;
      }
      .float-node {
        animation: float 3s ease-in-out infinite alternate;
      }

      @keyframes drawLine {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.4); opacity: 0.3; }
        100% { transform: scale(1); opacity: 0.8; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Geometric / Dynamic Background Elements (Kept low and in background) -->
  <g opacity="0.25">
    <path class="chart-area" d="M 600 280 L 600 210 Q 750 160 850 200 T 1100 130 L 1150 150 L 1150 280 Z" />
    <path class="chart-line" filter="url(#glow)" d="M 600 210 Q 750 160 850 200 T 1100 130 L 1150 150" />
    
    <!-- Dynamic Animated Grid Lines -->
    <line x1="600" y1="240" x2="1150" y2="240" stroke="#334155" stroke-width="1" stroke-dasharray="6,6" />
    <line x1="600" y1="180" x2="1150" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="6,6" />
    <line x1="600" y1="120" x2="1150" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="6,6" />

    <!-- Animated Data Nodes -->
    <g transform="translate(850, 200)">
      <circle cx="0" cy="0" r="10" fill="#8b5cf6" class="pulse-circle" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>
    <g transform="translate(1100, 130)">
      <circle cx="0" cy="0" r="12" fill="#ec4899" class="pulse-circle" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>
  </g>

  <!-- Decorative Top Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)" />

  <!-- Left Side Graphic: Investment Asset Nodes -->
  <g transform="translate(80, 150)" class="float-node">
    <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#6366f1" stroke-width="3" filter="url(#glow)" />
    <path d="M-10 10 L-10 -5 L0 -12 L10 -5 L10 10 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M-4 10 L-4 2 L4 2 L4 10" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- Main Content Foreground (Clear & Unobscured) -->
  <g transform="translate(150, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="74" class="badge-text">⚡ AWESOME INVESTMENT ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Alternative Investment Management</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Private Equity • Venture Capital • Private Credit • Fund Admin • Real Estate</text>
    <text x="0" y="205" class="subtitle" font-size="16px" fill="#64748b">Curated SaaS Platforms, Commercial Architectures & Open-Source Tools</text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="294" width="1200" height="6" fill="url(#accent-grad)" />
</svg>
